<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact – Pink Goose</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- Header -->
    <header class="container">
        <span class="logo">Pink <span class="goose">Goose</span></span>
        <nav>
            <a class="nav-link" href="index.html" title="To the homepage">Home</a>
            <a class="nav-link" href="learn.html" title="Learn more">Learn</a>
            <a class="nav-link" href="about.html" title="About us">About</a>
            <a class="nav-link" href="contact.html" title="Contact us">Contact</a>
        </nav>
        <a class="login-btn">Login</a>
    </header>

    <main>

        <!-- Contact CTA -->
        <section class="container-wide">
            <h1 class="section-title">What's your GOOSE idea?</h1>
            <h3>Let's chat and see how we can help</h3>
            <div class="contact-buttons">
                <a class="telegram" href="https://web.telegram.org/a/" target="_blank">
                    <i class="fa-brands fa-telegram"></i>
                    <div class="btn-text">
                        <span>Telegram</span>
                        <p>@superdao_team</p>
                    </div>
                </a>
                <a class="email-btn" href="mailto:hello@superdao.co">
                    <i class="fa-regular fa-at"></i>
                    <div class="btn-text">
                        <span>Email</span>
                        <p>hello@superdao.co</p>
                    </div>
                </a>
            </div>
        </section>

        <!-- Contact form -->
        <div class="form-placement">
            <form class="contact-form" action="#" method="post">
                <h2>Send a post Goose</h2>
                <input type="email" name="email" placeholder="Your email" required>
                <input type="text" name="name" placeholder="Your name">
                <textarea rows="13" name="message" placeholder="Your message"></textarea>
                <select name="goose-color">
                    <option value="" disabled selected>Color of your goose</option>
                    <option value="red">Red</option>
                    <option value="white">White</option>
                    <option value="blue">Blue</option>
                    <option value="black">Black</option>
                </select>
                <button type="submit">Send</button>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-spacer"></div>
        <nav class="footer-nav">
            <a class="footer-link" href="#about">About</a>
            <a class="footer-link" href="#jobs">Jobs</a>
            <a class="legal-footer" href="#legal">Legal</a>
        </nav>
        <div class="socials">
            <a href="https://x.com/home" title="X" target="_blank">
                <i class="fa-brands fa-x-twitter fa-beat social-icon--x"></i>
            </a>
            <a href="https://web.telegram.org/a/" title="Telegram" target="_blank">
                <i class="fa-brands fa-telegram fa-beat social-icon--telegram"></i>
            </a>
            <a href="https://www.youtube.com/watch?v=Aq5WXmQQooo" title="Youtube" target="_blank">
                <i class="fa-brands fa-youtube fa-beat social-icon--youtube"></i>
            </a>
            <a href="https://discord.com/" title="Discord" target="_blank">
                <i class="fa-brands fa-discord fa-beat social-icon--discord"></i>
            </a>
        </div>
    </footer>

</body>

</html>
